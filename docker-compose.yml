services:
  mysql:
    image: mysql:8.4
    container_name: ticket-mysql
    ports:
      # MySQL
      - "${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      MYSQL_DATABASE: ticket_center
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./ticket-center-api/src/main/resources/db/ticket.sql:/docker-entrypoint-initdb.d/01-ticket.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    ports:
      # Redis
      - "${REDIS_HOST_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: "${TICKET_REDIS_PASSWORD:?TICKET_REDIS_PASSWORD must be set}"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${TICKET_REDIS_PASSWORD}", "--masterauth", "${TICKET_REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 10s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ticket-rabbitmq
    ports:
      # RabbitMQ
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${TICKET_RABBITMQ_USERNAME:?TICKET_RABBITMQ_USERNAME must be set}"
      RABBITMQ_DEFAULT_PASS: "${TICKET_RABBITMQ_PASSWORD:?TICKET_RABBITMQ_PASSWORD must be set}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    profiles: ["full"]
    build:
      context: ./ticket-center-api
    container_name: ticket-backend
    ports:
      # Backend
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/ticket_center?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: root
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      TICKET_REDIS_HOST: redis
      TICKET_REDIS_PASSWORD: "${TICKET_REDIS_PASSWORD:?TICKET_REDIS_PASSWORD must be set}"
      TICKET_RABBITMQ_HOST: rabbitmq
      TICKET_RABBITMQ_USERNAME: "${TICKET_RABBITMQ_USERNAME:?TICKET_RABBITMQ_USERNAME must be set}"
      TICKET_RABBITMQ_PASSWORD: "${TICKET_RABBITMQ_PASSWORD:?TICKET_RABBITMQ_PASSWORD must be set}"
      LOGGING_LEVEL_ASIA_CREAT: info
      TICKET_OSS_ENABLED: "${TICKET_OSS_ENABLED:-false}"
      TICKET_OSS_ENDPOINT: "${TICKET_OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}"
      TICKET_OSS_BUCKET: "${TICKET_OSS_BUCKET:-}"
      TICKET_OSS_PUBLIC_DOMAIN: "${TICKET_OSS_PUBLIC_DOMAIN:-}"
      TICKET_OSS_OBJECT_PREFIX: "${TICKET_OSS_OBJECT_PREFIX:-uploads}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
      TICKET_OSS_SECURITY_TOKEN: "${TICKET_OSS_SECURITY_TOKEN:-${ALIBABA_CLOUD_SECURITY_TOKEN:-}}"
      TICKET_OSS_CLI_PROFILE: "${TICKET_OSS_CLI_PROFILE:-}"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build:
      context: ./ticket-center-web
    container_name: ticket-frontend
    environment:
      # 容器内后端是服务名，不是 localhost
      VITE_API_TARGET: "http://backend:8080"
    ports:
      # Frontend
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      # backend 没有定义 healthcheck，只能等它启动而非就绪。
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  backend-uploads:
