server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: ticket-gateway
  config:
    import:
      - optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
management:
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info
ticket:
  routes:
    core: ${TICKET_API_URL:http://localhost:8082}
    order: ${ORDER_SERVICE_URL:http://localhost:8083}
