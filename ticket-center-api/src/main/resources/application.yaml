server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: ticket-center-api
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./application-local.yaml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ticket_center?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ticket_core}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${TICKET_REDIS_HOST:localhost}
      port: ${TICKET_REDIS_PORT:6379}
      password: ${TICKET_REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 50
          max-idle: 50
          # min-idle 原为 1：空闲回收后突发流量要现建 49 条连接，握手全压在请求路径上
          min-idle: 8
          max-wait: 2s
          time-between-eviction-runs: 10s

  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
  jackson:
    default-property-inclusion: non_null



mybatis-plus:
  type-aliases-package: asia.creat.entity
logging:
  level:
    asia.creat: info
ticket:
  internal-token: ${TICKET_INTERNAL_TOKEN:}
  clients:
    order-url: ${ORDER_SERVICE_URL:http://localhost:8083}
  oss:
    enabled: ${TICKET_OSS_ENABLED:false}
    endpoint: ${TICKET_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket-name: ${TICKET_OSS_BUCKET:}
    public-domain: ${TICKET_OSS_PUBLIC_DOMAIN:}
    object-prefix: ${TICKET_OSS_OBJECT_PREFIX:uploads}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    security-token: ${TICKET_OSS_SECURITY_TOKEN:${ALIBABA_CLOUD_SECURITY_TOKEN:}}
    cli-profile: ${TICKET_OSS_CLI_PROFILE:}

management:
  server:
    port: ${MANAGEMENT_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
