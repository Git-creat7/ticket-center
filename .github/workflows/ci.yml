name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Check Docker
        run: docker version

      - name: Run backend tests
        run: mvn -B --no-transfer-progress test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ticket-center-web

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ticket-center-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

  publish-images:
    name: Publish Docker images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend images
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          image_repository="${IMAGE_REPOSITORY,,}"
          for module in ticket-center-api order-service ticket-gateway; do
            docker buildx build \
              --file Dockerfile \
              --build-arg "MODULE=$module" \
              --tag "$image_repository/$module:$IMAGE_TAG" \
              --tag "$image_repository/$module:latest" \
              --cache-from type=gha,scope="$module" \
              --cache-to type=gha,mode=max,scope="$module" \
              --push .
          done

      - name: Build and push frontend image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          image_repository="${IMAGE_REPOSITORY,,}"
          docker buildx build \
            --file ticket-center-web/Dockerfile \
            --tag "$image_repository/ticket-web:$IMAGE_TAG" \
            --tag "$image_repository/ticket-web:latest" \
            --cache-from type=gha,scope=ticket-web \
            --cache-to type=gha,mode=max,scope=ticket-web \
            --push ticket-center-web
