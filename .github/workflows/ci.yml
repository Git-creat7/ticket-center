name: CI

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

 concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    backend:
      name: Backend tests
      runs-on: ubuntu-latest
      timeout-minutes: 15

      defaults:
        run:
          working-directory: ticket-center-api

      steps:
        - name: Check out code
          uses: actions/checkout@v4

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
            cache: maven
            cache-dependency-path: ticket-center-api/pom.xml

        - name: Check Docker
          run: docker version

        - name: Run backend tests
          run: mvn -B --no-transfer-progress test

    frontend:
      name: Frontend build
      runs-on: ubuntu-latest
      timeout-minutes: 10

      defaults:
        run:
          working-directory: ticket-center-web

      steps:
        - name: Check out code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '24'
            cache: npm
            cache-dependency-path: ticket-center-web/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Build frontend
          run: npm run build