services:
  mysql:
    image: mysql:8.4
    container_name: ticket-mysql
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?请先在 .env 中设置 DB_PASSWORD}"
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/01-ticket.sql:/docker-entrypoint-initdb.d/01-ticket.sql:ro
      - ./deploy/mysql/02-order.sql:/docker-entrypoint-initdb.d/02-order.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: "${TICKET_REDIS_PASSWORD:?请先在 .env 中设置 TICKET_REDIS_PASSWORD}"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${TICKET_REDIS_PASSWORD}", "--masterauth", "${TICKET_REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 10s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ticket-rabbitmq
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${TICKET_RABBITMQ_USERNAME:?请先在 .env 中设置 TICKET_RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${TICKET_RABBITMQ_PASSWORD:?请先在 .env 中设置 TICKET_RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.4.2
    container_name: ticket-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${NACOS_HOST_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_HOST_PORT:-9848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
